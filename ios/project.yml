name: Wolverine
options:
  bundleIdPrefix: com.chaikosh
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  Wolverine:
    type: application
    platform: iOS
    sources:
      - path: stub.c
      - path: Assets.xcassets
      - path: ../build/ios-game/image.bin
        buildPhase: resources
      - path: ../build/ios-game/game
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Wolverine
        PRODUCT_BUNDLE_IDENTIFIER: com.chaikosh.wolverine
        INFOPLIST_FILE: Info-device.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 33UFZAL6L2
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - -force_load
          - $(PROJECT_DIR)/../build/ios-iphoneos/libwolvie.a
          - -L$(PROJECT_DIR)/../deps/ios-iphoneos/lib
          - -Wl,-export_dynamic
          - -lSDL3
          - -lavformat
          - -lavcodec
          - -lswscale
          - -lswresample
          - -lavutil
        OTHER_LDFLAGS[sdk=iphonesimulator*]:
          - -force_load
          - $(PROJECT_DIR)/../build/ios-iphonesimulator/libwolvie.a
          - -L$(PROJECT_DIR)/../deps/ios-iphonesimulator/lib
          - -Wl,-export_dynamic
          - -lSDL3
          - -lavformat
          - -lavcodec
          - -lswscale
          - -lswresample
          - -lavutil
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreFoundation.framework
      - sdk: OpenGLES.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
